<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="icon" href="./img/favicon.png">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <div class="centered-form">
        <div class="centered-form__box">
            <h1>Join</h1>
            <form action="./chat.html">
                <label for="">Display name</label>
                <input type="text" name="username" placeholder="Display Name" required autocomplete="off">
                <label for="">Room</label>
                <div id="rooms-list"></div>
                <button>Join</button>
            </form>
        </div>
    </div>
    <script id="rooms-template" type="text/html">
        <select name="room" id="room" required>
            <option value="">Select Room</option>
            {{#rooms}}
                <option value="{{_id}}">{{name}}</option>
            {{/rooms}}
        </ul>
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/3.0.1/mustache.min.js"></script>
    <script type="text/javascript">

        const roomsTemplate = document.querySelector('#rooms-template').innerHTML

        fetch('/rooms')
        .then((response) => {
            response.json().then((rooms) => {
                const html = Mustache.render(roomsTemplate, {
                    rooms
                })
    
                document.querySelector("#rooms-list").innerHTML = html
            })
        })
    </script>
</body>

</html>
